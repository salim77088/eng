[workspace]
resolver = "2"
members = [
    "crates/lumina-core",
    "crates/lumina-graphics",
    "crates/lumina-audio",
    "crates/lumina-script",
    "crates/lumina-particles",
    "crates/lumina-editor",
    "crates/lumina-engine",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Lumina Engine Contributors"]
repository = "https://github.com/salim77088/eng"
homepage = "https://github.com/salim77088/eng"
description = "Lumina Engine - a lightweight 2D/3D game engine with an integrated editor and an easy scripting language"
keywords = ["game-engine", "gamedev", "2d", "3d", "scripting"]
categories = ["game-engines", "graphics"]

[workspace.dependencies]
# Internal crates
lumina-core      = { path = "crates/lumina-core" }
lumina-graphics  = { path = "crates/lumina-graphics" }
lumina-audio     = { path = "crates/lumina-audio" }
lumina-script    = { path = "crates/lumina-script" }
lumina-particles = { path = "crates/lumina-particles" }
lumina-editor    = { path = "crates/lumina-editor" }
lumina-engine    = { path = "crates/lumina-engine" }

# Math
glam = { version = "0.29", features = ["bytemuck", "serde"] }

# Graphics
wgpu = { version = "22", features = ["dx12", "metal", "vulkan-portability", "webgpu"] }
winit = "0.30"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }

# Editor UI
egui = "0.29"
egui-wgpu = "0.29"
egui-winit = "0.29"

# Scripting
rhai = { version = "1.19", features = ["sync"] }

# ECS
hecs = "0.10"

# Audio
kira = "0.10"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"

# Logging
log = "0.4"
env_logger = "0.11"

# Utility
bytemuck = { version = "1.18", features = ["derive"] }
pollster = "0.4"
anyhow = "1"
thiserror = "1"
parking_lot = "0.12"
notify = "6"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
