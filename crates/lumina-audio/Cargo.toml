[package]
name = "lumina-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Audio playback for Lumina Engine (kira backend, with a null fallback)"

[features]
default = []
# Real audio backend via `kira`. Requires ALSA dev headers on Linux
# (`libasound2-dev`), CoreAudio on macOS (always present), WASAPI on
# Windows (always present). Disable for a no-op audio backend.
kira = ["dep:kira"]

[dependencies]
lumina-core.workspace = true
kira = { workspace = true, optional = true }
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
parking_lot.workspace = true
