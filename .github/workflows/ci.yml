name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build (${{ matrix.display_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # On Linux, also test without the audio feature (headless / no ALSA).
          - os: ubuntu-latest
            extra_args: "--no-default-features"
            display_name: "ubuntu-no-audio"
          - os: ubuntu-latest
            extra_args: ""
            display_name: "ubuntu-full"
          - os: windows-latest
            extra_args: ""
            display_name: "windows"
          - os: macos-latest
            extra_args: ""
            display_name: "macos"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libxcursor-dev

      - name: Check formatting
        if: matrix.display_name == 'ubuntu-full'
        run: cargo fmt --all -- --check

      - name: Build (debug)
        run: cargo build --workspace ${{ matrix.extra_args }}

      - name: Build (release)
        run: cargo build --workspace --release ${{ matrix.extra_args }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumina-${{ matrix.display_name }}
          path: |
            target/release/lumina
            target/release/lumina.exe
          if-no-files-found: ignore
          retention-days: 14
